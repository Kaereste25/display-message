<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Meine Nachricht ❤️</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f7f4ef,
          #eee9e1
        );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .card {

      width: 100%;
      max-width: 480px;

      background: rgba(255,255,255,0.96);

      border-radius: 28px;

      padding: 28px;

      box-shadow:
        0 12px 40px
        rgba(0,0,0,0.12);
    }

    h1 {

      text-align: center;

      margin:
        0 0 8px 0;

      font-size: 28px;
    }

    .subtitle {

      text-align: center;

      color: #777;

      margin-bottom: 24px;
    }

    .label {

      display: block;

      margin-top: 18px;
      margin-bottom: 7px;

      font-weight: 600;
    }

    input,
    textarea,
    select {

      width: 100%;

      border:
        1px solid #d7d7d7;

      border-radius: 14px;

      padding: 15px;

      font-size: 17px;

      font-family: inherit;

      outline: none;

      background: white;
    }

    input:focus,
    textarea:focus,
    select:focus {

      border-color: #888;
    }

    textarea {

      height: 150px;

      resize: vertical;

      min-height: 100px;

      margin-top: 8px;
    }

    button {

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 15px;

      margin-top: 14px;

      font-size: 17px;

      font-weight: 600;

      cursor: pointer;

      background: #202020;

      color: white;
    }

    button:active {

      transform: scale(0.99);
    }

    button:disabled {

      opacity: 0.5;

      cursor:
        not-allowed;
    }

    .secondary {

      background: #ececec;

      color: #222;
    }

    .colors {

      display: flex;

      gap: 12px;

      justify-content: center;

      margin-top: 15px;

      flex-wrap: wrap;
    }

    .color {

      width: 52px;
      height: 52px;

      border-radius: 50%;

      border:
        4px solid white;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.18);

      cursor: pointer;
    }

    .color.selected {

      outline:
        3px solid #222;

      outline-offset: 2px;
    }

    .preview-area {

      margin-top: 25px;

      display: flex;

      justify-content: center;
    }

    .note {

      width: 100%;

      max-width: 340px;

      min-height: 190px;

      padding:
        34px 22px 22px;

      position: relative;

      border-radius: 8px;

      box-shadow:
        7px 8px 12px
        rgba(0,0,0,0.15);

      transition:
        background 0.2s ease;
    }

    .pin {

      position: absolute;

      top: -8px;

      left: 50%;

      transform:
        translateX(-50%);

      width: 22px;
      height: 22px;

      border-radius: 50%;

      background: #d94a4a;

      box-shadow:
        0 2px 5px
        rgba(0,0,0,0.25);

      border:
        2px solid white;
    }

    .preview-text {

      white-space:
        pre-wrap;

      overflow-wrap:
        anywhere;

      font-family:
        "Comic Sans MS",
        "Segoe Print",
        cursive;

      font-size: 21px;

      color: #252525;

      line-height: 1.45;
    }

    .recipient-info {

      margin-top: 8px;

      padding: 12px 14px;

      background: #f5f5f5;

      border-radius: 12px;

      font-size: 14px;

      color: #555;

      text-align: center;
    }

    #loginArea {

      display: block;
    }

    #messageArea {

      display: none;
    }

    #status {

      min-height: 26px;

      text-align: center;

      margin-top: 15px;

      color: #555;
    }

    .error {

      color: #b42318 !important;
    }

    .success {

      color: #087443 !important;
    }

  </style>

</head>


<body>

<div class="card">

  <h1>
    Meine Nachricht ❤️
  </h1>

  <div class="subtitle">
    Kleine Nachrichten für euch beide
  </div>


  <!-- ========================================= -->
  <!-- LOGIN -->
  <!-- ========================================= -->

  <div id="loginArea">

    <input
      id="email"
      type="email"
      placeholder="E-Mail"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Passwort"
      autocomplete="current-password"
    >

    <button
      onclick="login()"
    >
      Anmelden
    </button>

  </div>


  <!-- ========================================= -->
  <!-- NACHRICHTENBEREICH -->
  <!-- ========================================= -->

  <div id="messageArea">

    <label class="label">
      Nachricht für
    </label>

    <select id="recipient">
      <option value="">
        Empfänger wird geladen...
      </option>
    </select>

    <div
      class="recipient-info"
      id="recipientInfo"
    >
      Wähle einen Empfänger aus.
    </div>


    <!-- Nachricht -->

    <label class="label">
      Deine Nachricht
    </label>

    <textarea
      id="message"
      maxlength="250"
      placeholder="Schreib etwas Schönes..."
      oninput="updatePreview()"
    ></textarea>


    <!-- Zettelfarbe -->

    <label class="label">
      Zettelfarbe
    </label>

    <div class="colors">

      <div
        class="color selected"
        data-color="#FFF0A8"
        style="background:#FFF0A8"
        onclick="selectColor(this)"
      ></div>

      <div
        class="color"
        data-color="#FFD6E7"
        style="background:#FFD6E7"
        onclick="selectColor(this)"
      ></div>

      <div
        class="color"
        data-color="#CFEFFF"
        style="background:#CFEFFF"
        onclick="selectColor(this)"
      ></div>

      <div
        class="color"
        data-color="#D8F3D0"
        style="background:#D8F3D0"
        onclick="selectColor(this)"
      ></div>

      <div
        class="color"
        data-color="#F5E8D0"
        style="background:#F5E8D0"
        onclick="selectColor(this)"
      ></div>

    </div>


    <!-- Vorschau -->

    <div class="preview-area">

      <div
        class="note"
        id="notePreview"
      >

        <div class="pin"></div>

        <div
          class="preview-text"
          id="previewText"
        >
          Deine Nachricht erscheint hier...
        </div>

      </div>

    </div>


    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      ❤️ Nachricht senden
    </button>


    <button
      class="secondary"
      onclick="logout()"
    >
      Abmelden
    </button>

  </div>


  <div
    id="status"
  ></div>

</div>


<script>

// =====================================================
// SUPABASE
// =====================================================

// HIER DEINE ECHTEN DATEN EINTRAGEN

const SUPABASE_URL =
  "https://puyhamcvmweubywijahm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_KNPxsxxrHKR3dwggwuxP8w_Wm_QUkxU";


const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// =====================================================
// VARIABLEN
// =====================================================

let currentUser = null;

let selectedColor =
  "#FFF0A8";

let profiles = [];


// =====================================================
// STATUS
// =====================================================

function showStatus(
  text,
  type = ""
) {

  const status =
    document.getElementById(
      "status"
    );

  status.innerText =
    text;

  status.className =
    type;
}


// =====================================================
// FARBE AUSWÄHLEN
// =====================================================

function selectColor(
  element
) {

  document
    .querySelectorAll(
      ".color"
    )
    .forEach(
      color => {

        color.classList.remove(
          "selected"
        );

      }
    );


  element.classList.add(
    "selected"
  );


  selectedColor =
    element.dataset.color;


  updatePreview();
}


// =====================================================
// VORSCHAU AKTUALISIEREN
// =====================================================

function updatePreview() {

  const text =
    document.getElementById(
      "message"
    ).value;


  const preview =
    document.getElementById(
      "previewText"
    );


  const note =
    document.getElementById(
      "notePreview"
    );


  if (
    text.length > 0
  ) {

    preview.innerText =
      text;

  } else {

    preview.innerText =
      "Deine Nachricht erscheint hier...";
  }


  note.style.background =
    selectedColor;
}


// =====================================================
// LOGIN
// =====================================================

async function login() {

  const email =
    document.getElementById(
      "email"
    ).value
      .trim();

  const password =
    document.getElementById(
      "password"
    ).value;


  if (
    !email ||
    !password
  ) {

    showStatus(
      "Bitte E-Mail und Passwort eingeben.",
      "error"
    );

    return;
  }


  showStatus(
    "Anmeldung..."
  );


  const {
    data,
    error
  } =
    await client.auth
      .signInWithPassword({

        email:
          email,

        password:
          password

      });


  if (error) {

    console.error(
      "Login error:",
      error
    );

    showStatus(
      "Login fehlgeschlagen: " +
      error.message,
      "error"
    );

    return;
  }


  currentUser =
    data.user;


  showStatus(
    "Angemeldet ✓",
    "success"
  );


  await showMessageArea();
}


// =====================================================
// LOGOUT
// =====================================================

async function logout() {

  await client.auth.signOut();

  currentUser =
    null;

  document.getElementById(
    "loginArea"
  ).style.display =
    "block";

  document.getElementById(
    "messageArea"
  ).style.display =
    "none";

  showStatus(
    "Abgemeldet"
  );
}


// =====================================================
// PROFILE LADEN
// =====================================================

async function loadProfiles() {

  const {
    data,
    error
  } =
    await client
      .from("profiles")
      .select(
        "id, display_name, display_id"
      )
      .order(
        "display_name"
      );


  if (error) {

    console.error(
      "Profiles error:",
      error
    );

    showStatus(
      "Empfänger konnten nicht geladen werden: " +
      error.message,
      "error"
    );

    return false;
  }


  profiles =
    data || [];


  const select =
    document.getElementById(
      "recipient"
    );


  select.innerHTML = "";


  // Eigene Person nicht als Empfänger anzeigen
  const recipients =
    profiles.filter(
      profile =>
        profile.id !==
        currentUser.id
    );


  if (
    recipients.length === 0
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value = "";

    option.textContent =
      "Kein Empfänger vorhanden";

    select.appendChild(
      option
    );

    updateRecipientInfo();

    return false;
  }


  recipients.forEach(
    profile => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        profile.id;

      option.textContent =
        profile.display_name;

      select.appendChild(
        option
      );

    }
  );


  select.onchange =
    updateRecipientInfo;


  updateRecipientInfo();


  return true;
}


// =====================================================
// EMPFÄNGER-INFO
// =====================================================

function updateRecipientInfo() {

  const select =
    document.getElementById(
      "recipient"
    );

  const info =
    document.getElementById(
      "recipientInfo"
    );


  if (
    !select.value
  ) {

    info.innerText =
      "Kein Empfänger ausgewählt.";

    return;
  }


  const selected =
    profiles.find(
      profile =>
        profile.id ===
        select.value
    );


  if (!selected) {

    info.innerText =
      "";

    return;
  }


  info.innerText =
    "Diese Nachricht erscheint auf dem Display von " +
    selected.display_name +
    ".";
}


// =====================================================
// NACHRICHTENBEREICH
// =====================================================

async function showMessageArea() {

  document.getElementById(
    "loginArea"
  ).style.display =
    "none";


  document.getElementById(
    "messageArea"
  ).style.display =
    "block";


  await loadProfiles();


  updatePreview();
}


// =====================================================
// NACHRICHT SENDEN
// =====================================================

async function sendMessage() {

  if (!currentUser) {

    showStatus(
      "Bitte zuerst anmelden.",
      "error"
    );

    return;
  }


  const message =
    document.getElementById(
      "message"
    ).value
      .trim();


  const recipientId =
    document.getElementById(
      "recipient"
    ).value;


  if (!recipientId) {

    showStatus(
      "Bitte einen Empfänger auswählen.",
      "error"
    );

    return;
  }


  if (!message) {

    showStatus(
      "Bitte eine Nachricht eingeben.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById(
      "sendButton"
    );


  button.disabled =
    true;


  showStatus(
    "Nachricht wird gesendet..."
  );


  const {
    error
  } =
    await client
      .from("messages")
      .insert({

        sender_id:
          currentUser.id,

        recipient_id:
          recipientId,

        message:
          message,

        note_color:
          selectedColor

      });


  button.disabled =
    false;


  if (error) {

    console.error(
      "Send error:",
      error
    );

    showStatus(
      "Fehler beim Senden: " +
      error.message,
      "error"
    );

    return;
  }


  const recipient =
    profiles.find(
      profile =>
        profile.id ===
        recipientId
    );


  showStatus(
    "Nachricht an " +
    recipient.display_name +
    " gesendet ❤️",
    "success"
  );
}


// =====================================================
// SESSION PRÜFEN
// =====================================================

async function init() {

  const {
    data,
    error
  } =
    await client.auth
      .getSession();


  if (error) {

    console.error(
      error
    );

    showStatus(
      "Supabase-Verbindung fehlgeschlagen.",
      "error"
    );

    return;
  }


  if (
    data.session &&
    data.session.user
  ) {

    currentUser =
      data.session.user;

    await showMessageArea();

  } else {

    document.getElementById(
      "loginArea"
    ).style.display =
      "block";

    document.getElementById(
      "messageArea"
    ).style.display =
      "none";
  }
}


init();

</script>

</body>

</html>
